listen_addr = "0.0.0.0:8080"

algorithm = "round_robin"

[health_check]
path = "/health"
interval_secs = 5
timeout_secs = 2
unhealthy_threshold = 3
healthy_threshold = 2

[[backends]]
addr = "127.0.0.1:9001"
weight = 1

[[backends]]
addr = "127.0.0.1:9002"
weight = 1

[[backends]]
addr = "127.0.0.1:9003"
weight = 2
