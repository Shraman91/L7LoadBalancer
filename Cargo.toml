[package]
name = "l7-load-balancer"
version = "0.1.0"
edition = "2021"

[lib]
name = "l7_load_balancer"
path = "src/lib.rs"

[[bin]]
name = "l7lb"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "1.0"
rand = "0.8"
tokio-util = { version = "0.7", features = ["full"] }
futures-util = "0.3"
arc-swap = "1.7"
serde_json = "1.0"
notify = "6.1"
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.2"
rustls-pki-types = "1.0"
hyper-rustls = { version = "0.27", default-features = false, features = ["ring", "http1", "http2", "tls12", "webpki-roots"] }
webpki-roots = "1.0"
parking_lot = "0.12"
prometheus = { version = "0.13", default-features = false }

[profile.dev]
incremental = false
codegen-units = 1

[profile.test]
incremental = false
codegen-units = 1

[profile.release]
lto = true
opt-level = 3
incremental = false
codegen-units = 1
